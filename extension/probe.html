<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Qalqan — проверка модели</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --bg:#fff; --fg:#0f0f0f; --muted:#606060; --line:#e5e5e5;
    --accent:#c4302b; --ok:#1a7f37; --chip:#f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181818; --fg:#f1f1f1; --muted:#aaa; --line:#3f3f3f;
            --accent:#ff4e45; --ok:#4ac26b; --chip:#2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.6 "Roboto", system-ui, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--fg);
         margin: 0 auto; padding: 32px 24px; max-width: 640px; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  textarea { width: 100%; min-height: 84px; padding: 12px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--chip); color: var(--fg);
             font: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bar { height: 8px; border-radius: 4px; background: var(--chip); margin: 18px 0 10px;
         overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .prob { font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
  .prob small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; margin: 18px 0 0; font-size: 13px; }
  td { padding: 8px 0; border-top: 1px solid var(--line); }
  td:last-child { text-align: right; font-weight: 500; }
  .hide { color: var(--accent); }
  .keep { color: var(--ok); }
  .preview { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .preview h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
                color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .status { color: var(--muted); font-size: 12.5px; margin-top: 20px; }
</style>
</head>
<body>

<h1>Qalqan: что скажет модель</h1>
<p class="sub">Впишите комментарий — увидите вероятность и решение при обоих порогах.
   Всё считается здесь же, в браузере.</p>

<textarea id="in" placeholder="Мәтінді осында жазыңыз…" disabled></textarea>

<div class="bar"><div class="fill" id="fill"></div></div>
<div class="prob"><span id="pct">— %</span><small>вероятность, что комментарий оскорбительный</small></div>

<table>
  <tr><td>Умеренно (порог 70 %)</td><td id="v70">—</td></tr>
  <tr><td>Строго (порог 50 %)</td><td id="v50">—</td></tr>
</table>

<div class="preview">
  <h2>Так это выглядит в ленте</h2>
  <div id="demo">—</div>
</div>

<p class="status" id="status">загружаю модель…</p>

<script type="module">
const $ = (id) => document.getElementById(id);
const status = $("status");

let toxicProbability;
try {
  const t0 = performance.now();
  const mod = await import("./classifier.js");
  const m = await mod.loadModel("./model.json");
  toxicProbability = mod.toxicProbability;
  status.textContent =
    `модель загружена за ${Math.round(performance.now() - t0)} мс · ` +
    `признаков: ${Object.keys(m.word.vocab).length} слов + ${Object.keys(m.char.vocab).length} буквосочетаний`;
  $("in").disabled = false;
  $("in").focus();
} catch (e) {
  status.textContent = "ОШИБКА: " + e.message;
  throw e;
}

function verdict(cell, p, thr) {
  const hide = p > thr;
  cell.textContent = hide ? "скрыть" : "показать";
  cell.className = hide ? "hide" : "keep";
}

$("in").addEventListener("input", () => {
  const text = $("in").value.trim();
  const demo = $("demo");
  if (!text) {
    $("pct").textContent = "— %"; $("fill").style.width = "0";
    $("v70").textContent = $("v50").textContent = "—";
    $("v70").className = $("v50").className = "";
    demo.textContent = "—"; demo.className = "";
    return;
  }
  const t0 = performance.now();
  const p = toxicProbability(text);
  const ms = performance.now() - t0;

  $("pct").textContent = (p * 100).toFixed(1) + " %";
  $("fill").style.width = (p * 100) + "%";
  verdict($("v70"), p, 0.70);
  verdict($("v50"), p, 0.50);

  demo.textContent = text;
  demo.className = p > 0.70 ? "tox-blur" : "";
  demo.title = p > 0.70 ? "Мүмкін, дөрекі пікір. Көру үшін басыңыз" : "";

  status.textContent = `посчитано за ${ms.toFixed(2)} мс`;
});
</script>
</body>
</html>
